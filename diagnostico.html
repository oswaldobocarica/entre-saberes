<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnóstico — Entre Saberes</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="experience.css?v=20261002-40"></head><body><header class="site-header"><div class="container nav"><a class="brand" href="index.html">ENTRE SABERES</a><nav class="nav-links"><a href="index.html">Portal</a><a href="admin/">Admin</a></nav></div></header><main><section class="page-hero"><div class="container"><div class="eyebrow">Verificação técnica</div><h1>Diagnóstico do portal</h1><p class="lead">Esta página apenas consulta o Supabase. Ela não altera nem apaga dados.</p></div></section><section class="section"><div class="container"><div id="diag" class="content-list"><div class="notice">Executando verificações…</div></div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0"></script><script src="config.js?v=20261002-40"></script><script>
(async()=>{const out=document.getElementById('diag');const cfg=window.ENTRE_SABERES_CONFIG;const rows=[];const ok=(n,d)=>rows.push({ok:true,n,d}),bad=(n,d)=>rows.push({ok:false,n,d});if(!cfg?.supabaseUrl||!cfg?.supabasePublishableKey){bad('Configuração Supabase','URL ou chave pública ausente.');render();return}ok('Configuração','URL e chave pública carregadas.');const sb=window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey,{auth:{persistSession:true,storageKey:'entre-saberes-cms-auth-v19'}});async function test(label,table){try{const {data,error,count}=await sb.from(table).select('*',{count:'exact',head:true});if(error)bad(label,error.message);else ok(label,`${count??0} registro(s) visível(is) para esta sessão.`)}catch(e){bad(label,e.message)}}await test('Publicações','publications');await test('Categorias','categories');await test('Cursos EAD','lms_courses');await test('Aulas Aulas','ejatec_lessons');try{const {data}=await sb.auth.getSession();ok('Sessão administrativa',data?.session?`Usuário autenticado: ${data.session.user.email}`:'Nenhum administrador logado neste navegador (normal para visitantes).')}catch(e){bad('Sessão administrativa',e.message)}render();function render(){out.innerHTML=rows.map(r=>`<article class="content-item"><strong>${r.ok?'✓':'⚠'} ${esc(r.n)}</strong><p>${esc(r.d)}</p></article>`).join('')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}})();
</script><script src="accessibility.js?v=20261002-40"></script></body></html>
