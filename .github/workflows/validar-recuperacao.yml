name: Homologar Entre Saberes (sem publicar)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout da ramificacao escolhida
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Validar testes do Worker
        run: |
          if [ -f tests/worker.test.mjs ]; then
            npm test
          else
            echo 'Sem testes automatizados; verificacao de testes ignorada.'
          fi
      - name: Validar sintaxe JavaScript do painel
        run: node --check admin/admin.js
      - name: Preparar pacote sem publicar no Cloudflare
        run: npx wrangler deploy --dry-run --outdir /tmp/entre-saberes-validation
