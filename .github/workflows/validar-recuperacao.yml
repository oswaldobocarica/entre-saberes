name: Homologar Entre Saberes (sem publicar)

on:
  push:
    branches:
      - recuperacao-neon-cloudflare
      - integracao-neon-homologacao-20261027
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout da ramificacao isolada
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Executar todos os testes obrigatorios
        run: npm test
      - name: Validar sintaxe JavaScript
        run: |
          node --check admin/admin.js
          node --check _worker.js
          node --check portal.js
          node --check cms-public.js
          node --check neon-public-client.js
          node --check neon/worker.js
      - name: Preparar pacote original sem publicar
        run: npx wrangler deploy --dry-run --outdir /tmp/entre-saberes-validation
      - name: Preparar homologacao Neon sem publicar
        run: npx wrangler deploy --config wrangler.homologacao.jsonc --dry-run --outdir /tmp/entre-saberes-neon-validation
