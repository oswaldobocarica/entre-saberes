name: Homologar Entre Saberes (sem publicar)

on:
  push:
    branches:
      - recuperacao-neon-cloudflare
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout da ramificacao isolada
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependencias
        run: npm install --no-audit --no-fund
      - name: Executar testes obrigatorios
        run: npm test
      - name: Validar sintaxe JavaScript do painel e Worker
        run: |
          node --check admin/admin.js
          node --check _worker.js
      - name: Preparar pacote sem publicar no Cloudflare
        run: npx wrangler deploy --dry-run --outdir /tmp/entre-saberes-validation
