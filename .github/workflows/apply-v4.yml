name: Apply Entre Saberes v4.0
on:
  push:
    branches: [main]
    paths:
      - ".v4trigger"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch staged bundle
        run: |
          git fetch origin v4-staging:v4-staging
          git show v4-staging:.v4bundle/site-v40.tar.gz > /tmp/site-v40.tar.gz
          echo "666ebc51a5f4ef7334d3a5fdbfcca8cb6fa687628fdb0f756fb7c588d4469dc7  /tmp/site-v40.tar.gz" | sha256sum -c -
      - name: Replace site files
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          tar -xzf /tmp/site-v40.tar.gz -C .
          rm -f .v4trigger
          rm -f .github/workflows/apply-v4.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
      - name: Commit v4.0
        run: |
          git config user.name "Entre Saberes Deploy"
          git config user.email "oswaldobocarica@gmail.com"
          git add -A
          git commit -m "Deploy Entre Saberes v4.0"
          git push origin main
