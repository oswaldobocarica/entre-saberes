name: Deploy Entre Saberes to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: entre-saberes-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: d7733a6559aabe8f394a57af0cfe42d0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Worker tests
        shell: bash
        run: |
          if [ -f tests/worker.test.mjs ]; then
            npm test
          else
            echo "tests/worker.test.mjs not present in repository; skipping test step."
          fi

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
