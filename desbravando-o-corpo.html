<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Desbravando o Corpo Humano</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f4ef;--fg:#1d1d1b;--card:#fff;--mut:#6b6b66;--ac:#b3261e;--ok:#1b7f4b;--bd:#ddd8cc}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--fg:#ecebe6;--card:#222226;--mut:#9c9a92;--ac:#ff7b6e;--ok:#4cc98b;--bd:#37373d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:16px;max-width:760px;margin-inline:auto}
h1{font-size:22px;margin:0 0 4px}small,.m{color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0}
.tabs button,.g button,.o{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;cursor:pointer}
.tabs button{padding:6px 10px;white-space:nowrap}.tabs .on{border-color:var(--ac);color:var(--ac)}
.tabs button:disabled,.g button:disabled{opacity:.4;cursor:not-allowed}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin:8px 0}
.g button{padding:6px 0}.g .d{background:var(--ok);color:#fff;border-color:var(--ok)}.g .c{border-color:var(--ac);border-width:2px}
.box{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-top:10px}
.o{display:block;width:100%;text-align:left;padding:10px;margin-top:8px}
.o.r{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}.o.w{border-color:var(--ac)}
.bar{display:flex;gap:12px;flex-wrap:wrap;font-size:14px}
.tag{display:inline-block;font-size:12px;border:1px solid var(--bd);border-radius:99px;padding:1px 8px;margin-right:4px}
</style></head><body><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:14px"><a href="jogos.html" style="color:inherit;font-weight:700">← Jogos</a><a href="index.html" style="color:inherit">Entre Saberes</a></div>
<h1>🦴 Desbravando o Corpo Humano</h1>
<small>256 fases · 8 ciclos · a linguagem se adapta ao seu desempenho</small>
<div class="bar box" id="st"></div>
<div class="tabs" id="tabs"></div>
<div id="info" class="m"></div>
<div class="g" id="grid"></div>
<div class="box" id="q">Escolha uma fase.</div>

<script type="application/json" id="data">
{"tiers":["Explorador","Aprendiz","Técnico","Acadêmico"],
"cycles":[
{"n":"Ciclo 1 · Ossos","bncc":"BNCC · Ciências da Natureza (EF) · Vida e Evolução: sistema locomotor","c":[
["Fêmur",["O osso mais longo do corpo, fica na coxa.","Osso da coxa que sustenta o peso do corpo ao andar.","Osso longo que se liga ao quadril e ao joelho.","Maior osso longo: a cabeça articula com o acetábulo e os côndilos com a tíbia."]],
["Crânio",["A caixa de osso que protege o cérebro.","Conjunto de ossos que protege o encéfalo e o rosto.","Neurocrânio e viscerocrânio unidos por suturas.","Ossos planos unidos por suturas fibrosas, formando neuro e viscerocrânio."]],
["Coluna vertebral",["A fileira de ossinhos nas suas costas.","Pilha de vértebras que sustenta o tronco e protege a medula.","Cerca de 33 vértebras em regiões cervical, torácica, lombar, sacral e coccígea.","Eixo axial segmentado com curvaturas fisiológicas que amortecem cargas."]],
["Costelas",["Ossos curvos que protegem o peito.","Ossos em arco que protegem coração e pulmões.","Doze pares articulados às vértebras torácicas, quase todos ao esterno.","Pares costais que se movem na respiração, ampliando o volume torácico."]]]},
{"n":"Ciclo 2 · Articulações e músculos","bncc":"BNCC · EF · Vida e Evolução: movimento e sustentação","c":[
["Joelho",["A dobradiça no meio da perna.","Articulação que permite dobrar e esticar a perna.","Articulação sinovial em dobradiça entre fêmur, tíbia e patela.","Articulação troclear com meniscos e ligamentos cruzados estabilizando o plano sagital."]],
["Bíceps",["Músculo da frente do braço que dobra o cotovelo.","Músculo que flexiona o cotovelo e gira o antebraço.","Flexor do cotovelo e supinador do antebraço.","Músculo bi-articular, flexor do cotovelo e supinador do antebraço."]],
["Tendão",["Faixa forte que prende o músculo ao osso.","Tecido resistente que liga músculo a osso.","Tecido conjuntivo denso que transmite a força do músculo ao osso.","Colágeno tipo I alinhado que transmite força e armazena energia elástica."]],
["Sarcômero",["A menor peça que faz o músculo encurtar.","Unidade que se encurta quando o músculo contrai.","Unidade contrátil entre duas linhas Z, com actina e miosina.","Unidade funcional da miofibrila; filamentos deslizam pelas pontes cruzadas."]]]},
{"n":"Ciclo 3 · Sistema nervoso","bncc":"BNCC · EF · Vida e Evolução: sistema nervoso e sentidos","c":[
["Neurônio",["A célula que leva mensagens pelo corpo.","Célula nervosa que transmite impulsos elétricos.","Célula com dendritos, corpo celular e axônio que conduz o impulso.","Célula excitável; o potencial de ação se propaga e libera neurotransmissores na sinapse."]],
["Cérebro",["O centro de comando do corpo, dentro da cabeça.","Órgão que processa sentidos, pensamentos e movimentos.","Parte do encéfalo dividida em lobos e hemisférios.","Telencéfalo com córtex que integra funções motoras, sensoriais e cognitivas."]],
["Medula espinal",["Um cabo de nervos dentro da coluna.","Via que leva mensagens entre o cérebro e o corpo.","Cordão nervoso dentro do canal vertebral que origina 31 pares de nervos.","Centro de reflexos e via de tratos ascendentes e descendentes."]],
["Reflexo",["Reação rápida que acontece sem pensar.","Resposta automática a um estímulo, como tirar a mão do fogo.","Resposta involuntária mediada por um arco reflexo.","Resposta motora estereotipada via receptor, aferente, integração medular e eferente."]]]},
{"n":"Ciclo 4 · Circulação e respiração","bncc":"BNCC · EF · Vida e Evolução: sistemas circulatório e respiratório","c":[
["Coração",["A bomba que empurra o sangue pelo corpo.","Órgão muscular de quatro câmaras que bombeia sangue.","Duas aurículas e dois ventrículos com válvulas que garantem fluxo unidirecional.","Bomba dupla: circuito pulmonar de baixa pressão e sistêmico de alta pressão."]],
["Pulmão",["Onde o ar que respiramos entra.","Órgão onde o sangue recebe oxigênio e libera gás carbônico.","Órgão esponjoso onde ocorre a troca gasosa (hematose).","Órgão elástico cuja complacência e superfície alveolar otimizam a difusão de gases."]],
["Alvéolo",["Bolsinha minúscula do pulmão.","Pequena bolsa de ar cercada de vasos finos.","Saco de parede fina onde O₂ e CO₂ trocam de lugar com o sangue.","Unidade de troca gasosa; difusão passiva pela membrana alvéolo-capilar."]],
["Hemoglobina",["Proteína que carrega oxigênio no sangue.","Proteína dos glóbulos vermelhos que transporta oxigênio.","Proteína com ferro que liga O₂ nos pulmões e o libera nos tecidos.","Proteína tetramérica com cooperatividade; a curva de dissociação do O₂ é sigmoide."]]]},
{"n":"Ciclo 5 · Órgãos e sistemas","bncc":"BNCC · EF/EM · Digestão, excreção e regulação hormonal","c":[
["Estômago",["Bolsa que mistura a comida com suco ácido.","Órgão que mistura o alimento com suco gástrico.","Órgão do sistema digestório com ácido clorídrico e pepsina.","Órgão com células parietais (HCl) e principais (pepsinogênio) iniciando a digestão proteica."]],
["Fígado",["O órgão grande à direita que ajuda a limpar o corpo.","Órgão que filtra substâncias e produz a bile.","Maior glândula do corpo; metaboliza nutrientes e produz bile.","Centro metabólico: gliconeogênese, glicogênio, detoxificação e síntese proteica."]],
["Rim",["Órgão que faz a xixi, filtrando o sangue.","Órgão que filtra o sangue e produz urina.","Órgão cujos néfrons filtram, reabsorvem e secretam.","Regula volume, pH e eletrólitos por filtração glomerular, reabsorção e secreção."]],
["Pâncreas",["Órgão que controla o açúcar do sangue.","Glândula que produz insulina e sucos digestivos.","Glândula mista: ilhotas endócrinas e ácinos exócrinos.","Secreta insulina e glucagon (ilhotas) e enzimas digestivas (ácinos)."]]]},
{"n":"Ciclo 6 · Fisiologia do exercício","bncc":"BNCC · EM · Saúde e bem-estar → Ensino Superior","c":[
["VO₂ máx",["O máximo de ar que o corpo aproveita ao correr forte.","Consumo máximo de oxigênio durante o esforço.","Maior taxa de consumo de O₂ medida em teste incremental.","Produto do débito cardíaco máximo pela diferença arteriovenosa de O₂ (Fick)."]],
["Lactato",["Uma substância que o músculo produz ao esforço forte.","Substância produzida quando o esforço é intenso.","Produto da glicólise que se acumula acima do limiar.","Metabólito do piruvato, usado como combustível e sinalizador; limiar de lactato marca a transição metabólica."]],
["Frequência cardíaca",["Quantas vezes o coração bate por minuto.","Batimentos por minuto, que aumentam com o esforço.","Medida usada para controlar a intensidade do treino.","Variável cronotrópica regulada pelo equilíbrio simpático-vagal."]],
["Débito cardíaco",["Quanto sangue o coração envia por minuto.","Volume de sangue bombeado em um minuto.","Frequência cardíaca multiplicada pelo volume sistólico.","Q = FC × VS; aumenta no exercício por ambos os fatores."]]]},
{"n":"Ciclo 7 · Fisiologia do movimento","bncc":"Ensino Superior · Controle motor","c":[
["Unidade motora",["Um nervo mais as fibras que ele comanda.","Um neurônio motor e as fibras musculares que ele inerva.","Conjunto de um motoneurônio α e suas fibras musculares.","Menor unidade de controle motor; o recrutamento segue o princípio do tamanho de Henneman."]],
["Fuso muscular",["Sensor que avisa o cérebro o quanto o músculo está esticado.","Receptor que detecta o alongamento do músculo.","Receptor de estiramento que dispara o reflexo miotático.","Proprioceptor intrafusal com fibras Ia e II que informa comprimento e velocidade."]],
["Órgão tendinoso de Golgi",["Sensor no tendão que avisa sobre a força.","Receptor no tendão que mede a tensão.","Proprioceptor na junção músculo-tendão que detecta tensão (Ib).","Receptor em série que mede tensão e promove inibição autogênica."]],
["Ciclo alongamento-encurtamento",["O músculo estica e logo em seguida contrai forte, como num salto.","Um alongamento rápido que dá mais força na contração seguinte.","Pré-alongamento excêntrico que potencializa a fase concêntrica.","Armazenamento de energia elástica e reflexo miotático que potencializam a fase concêntrica."]]]},
{"n":"Ciclo 8 · Biomecânica","bncc":"Ensino Superior · Biomecânica","c":[
["Alavanca",["Barra que gira em torno de um ponto e ajuda a mover coisas.","Estrutura rígida que gira em torno de um eixo para multiplicar força ou velocidade.","Osso (barra), articulação (eixo), força muscular e resistência.","Sistemas de 1ª, 2ª e 3ª classe; o braço de força determina a vantagem mecânica."]],
["Torque",["A força que faz algo girar.","Efeito de giro de uma força sobre uma articulação.","Produto da força pela distância perpendicular ao eixo.","Momento de força: M = F × d⊥ em torno do eixo articular."]],
["Centro de massa",["O ponto onde o peso do corpo está equilibrado.","Ponto onde se considera concentrado o peso do corpo.","Ponto que representa a massa total do corpo e muda com a postura.","Ponto médio ponderado da massa corporal, que varia com a posição dos segmentos."]],
["Força de reação do solo",["A força que o chão devolve quando pisamos.","A força que o chão faz sobre o corpo ao andar ou saltar.","Força de contato do solo sobre o pé, pela 3ª lei de Newton.","Vetor de reação medido por plataforma de força, com componentes vertical e ântero-posterior."]]]}
]}
</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
let S={cy:0,prog:Array(8).fill(0),tier:0,streak:0,miss:0,xp:0,ph:null};
try{const v=localStorage.getItem('corpo256');if(v)S=Object.assign(S,JSON.parse(v));}catch(e){}
const save=()=>{try{localStorage.setItem('corpo256',JSON.stringify(S))}catch(e){}};
const $=i=>document.getElementById(i);
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function draw(){
 const tot=S.prog.reduce((a,b)=>a+b,0);
 $('st').innerHTML=`<span>Fases: <b>${tot}/256</b></span><span>XP: <b>${S.xp}</b></span><span>Linguagem: <b>${D.tiers[S.tier]}</b></span><span>Sequência: <b>${S.streak}</b></span>`;
 $('tabs').innerHTML='';
 D.cycles.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.n;b.disabled=i>0&&S.prog[i-1]<32;b.className=i==S.cy?'on':'';b.onclick=()=>{S.cy=i;S.ph=null;draw();$('q').textContent='Escolha uma fase.'};$('tabs').appendChild(b)});
 const c=D.cycles[S.cy];
 $('info').innerHTML=`<span class="tag">${c.bncc}</span> Fases ${S.cy*32+1}–${S.cy*32+32}`;
 $('grid').innerHTML='';
 for(let i=0;i<32;i++){const b=document.createElement('button');b.textContent=S.cy*32+i+1;b.disabled=i>S.prog[S.cy];b.className=i<S.prog[S.cy]?'d':(i==S.prog[S.cy]?'c':'');b.onclick=()=>play(i);$('grid').appendChild(b)}
}
function play(i){
 S.ph=i;const c=D.cycles[S.cy].c,k=i%4,mode=(i>>2)&1,t=S.tier,boss=i%8==7;
 const right=c[k],others=sh(c.filter((_,j)=>j!=k));
 const opts=sh([right,...others]);
 const stem=mode==0?`<b>Qual conceito é este?</b><br>“${right[1][t]}”`:`<b>Qual descrição corresponde a “${right[0]}”?</b>`;
 const q=$('q');
 q.innerHTML=`<small>Fase ${S.cy*32+i+1} ${boss?'· ⚔️ Fase-desafio (XP em dobro)':''} · ${D.tiers[t]}</small><p>${stem}</p>`;
 opts.forEach(o=>{const b=document.createElement('button');b.className='o';b.textContent=mode==0?o[0]:o[1][t];b.onclick=()=>answer(b,o===right,right,boss,q);q.appendChild(b)});
}
function answer(b,ok,r,boss,q){
 q.querySelectorAll('.o').forEach(x=>x.disabled=true);
 const nt=Math.min(3,S.tier+1);
 if(ok){b.classList.add('r');S.xp+=(boss?20:10)+S.tier*2;S.streak++;S.miss=0;
  if(S.ph==S.prog[S.cy])S.prog[S.cy]++;
  if(S.streak>=3&&S.tier<3){S.tier++;S.streak=0}}
 else{b.classList.add('w');S.streak=0;S.miss++;if(S.miss>=2&&S.tier>0){S.tier--;S.miss=0}}
 const f=document.createElement('div');f.className='m';f.style.marginTop='10px';
 f.innerHTML=(ok?'✅ Correto! ':'❌ Quase. ')+`<b>${r[0]}</b>: ${r[1][S.tier]}<br><small>Próximo nível de linguagem: ${r[1][nt]}</small>`;
 const n=document.createElement('button');n.className='o';n.textContent=ok?'Próxima fase →':'Tentar de novo';
 n.onclick=()=>{if(ok){const nx=S.ph+1;if(nx<32)play(nx);else if(S.cy<7){S.cy++;S.ph=null;q.textContent='Novo ciclo desbloqueado! Escolha uma fase.'}else q.innerHTML='🏆 As 256 fases concluídas. Você desbravou o corpo humano!';}else play(S.ph);draw();save()};
 q.append(f,n);draw();save();
}
draw();
</script></body></html>
